<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNet Admin</title><style>
body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#eef4f1;color:#10302f}
.c{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #d3e0db}
input,button{width:100%;padding:12px;border-radius:10px;font:inherit;margin:4px 0 8px;border:1px solid #d3e0db}
button{background:#0d7c66;color:#fff;border:0;font-weight:700;cursor:pointer}#err{color:#b42318}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g div{background:#eef4f1;border-radius:10px;padding:10px}.g b{display:block;font-size:22px}
label{font-size:14px;font-weight:600}.ph{display:flex;gap:8px}.ph select{width:118px;padding:12px;border-radius:10px;border:1px solid #d3e0db;margin:4px 0 8px;font:inherit}pre{white-space:pre-wrap;background:#eef4f1;padding:10px;border-radius:10px}.mu{font-size:14px;color:#56706c}</style></head><body>
<h1>FreeNet Admin</h1><p id="err" role="alert"></p>
<div class="c" id="up" hidden><h2>Create the super admin account</h2><p class="mu">First-time setup. Enter the ADMIN_KEY from your server’s .env file as the setup code.</p>
<label for="em">Phone number</label><div class="ph"><select id="cc" aria-label="Country code"><option value="+234">🇳🇬 +234</option><option value="+233">🇬🇭 +233</option><option value="+254">🇰🇪 +254</option><option value="+27">🇿🇦 +27</option><option value="+229">🇧🇯 +229</option><option value="+228">🇹🇬 +228</option><option value="+225">🇨🇮 +225</option><option value="+237">🇨🇲 +237</option><option value="+256">🇺🇬 +256</option><option value="+255">🇹🇿 +255</option><option value="+20">🇪🇬 +20</option><option value="+44">🇬🇧 +44</option><option value="+1">🇺🇸 +1</option><option value="+971">🇦🇪 +971</option><option value="+91">🇮🇳 +91</option></select><input id="em" type="tel" placeholder="803 000 0000" autocomplete="tel-national"></div>
<input id="nm" placeholder="Your name"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"><input id="sc" type="password" placeholder="Setup code (ADMIN_KEY)">
<button onclick="auth('register')">Sign up</button></div>
<div class="c" id="in" hidden><h2>Admin sign in</h2><input id="pw2" type="password" placeholder="Password" autocomplete="current-password">
<label for="em2">Phone number</label><div class="ph"><select id="cc2" aria-label="Country code"><option value="+234">🇳🇬 +234</option><option value="+233">🇬🇭 +233</option><option value="+254">🇰🇪 +254</option><option value="+27">🇿🇦 +27</option><option value="+229">🇧🇯 +229</option><option value="+228">🇹🇬 +228</option><option value="+225">🇨🇮 +225</option><option value="+237">🇨🇲 +237</option><option value="+256">🇺🇬 +256</option><option value="+255">🇹🇿 +255</option><option value="+20">🇪🇬 +20</option><option value="+44">🇬🇧 +44</option><option value="+1">🇺🇸 +1</option><option value="+971">🇦🇪 +971</option><option value="+91">🇮🇳 +91</option></select><input id="em2" type="tel" placeholder="803 000 0000" autocomplete="tel-national"></div><button onclick="auth('login')">Sign in</button></div>
<div id="dash" hidden><div class="c"><h2>Network</h2><div class="g" id="st"></div></div>
<div class="c"><h2>Create vouchers</h2><input id="vm" type="number" value="60" aria-label="Minutes each"><input id="vn" type="number" value="5" aria-label="How many"><button onclick="gen()">Generate codes</button><pre id="out" hidden></pre></div>
<button onclick="sessionStorage.removeItem('a');location.reload()">Sign out</button></div>
<script>
let T=sessionStorage.getItem('a')||'';const $=i=>document.getElementById(i),err=m=>$('err').textContent=m||'';
async function api(p,b){let r,j;try{r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined})}catch{throw new Error('Cannot reach the server. Open this page from your running backend, for example http://SERVER_IP:3000/')}
  try{j=JSON.parse(await r.text())}catch{throw new Error('The server did not send data. Open this page from your running backend (not GitHub or a saved file) and make sure the API is running.')}
  if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
const full=(c,n)=>$(c).value+$(n).value.replace(/\D/g,'').replace(/^0+/,'');
async function init(){try{if(T){await load();return}const s=await api('status');$('up').hidden=s.hasAdmin;$('in').hidden=!s.hasAdmin}catch(e){err(e.message)}}
async function auth(k){try{err();const b=k==='register'?{name:$('nm').value,password:$('pw').value,phone:full('cc','em'),setup_code:$('sc').value}:{password:$('pw2').value,phone:full('cc2','em2')};
  const j=await api(k,b);T=j.token;sessionStorage.setItem('a',T);await load()}catch(e){err(e.message)}}
async function load(){try{const s=await api('stats');$('up').hidden=$('in').hidden=true;$('dash').hidden=false;
  const L={users:'Users',ad_views:'Ad views',sponsor_revenue:'Sponsor revenue (₦)',plan_revenue:'Plan revenue (₦)',open_vouchers:'Unused vouchers'};
  $('st').innerHTML=Object.keys(L).map(k=>`<div><b>${s[k]}</b>${L[k]}</div>`).join('')}catch(e){sessionStorage.removeItem('a');T='';init()}}
async function gen(){try{err();const j=await api('vouchers',{minutes:+$('vm').value,count:+$('vn').value});$('out').hidden=false;$('out').textContent=j.codes.join('\n');load()}catch(e){err(e.message)}}
init();</script></body></html>
