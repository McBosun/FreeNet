<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNet Sponsors</title><style>
body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#eef4f1;color:#10302f}
.c{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #d3e0db}
input,button{width:100%;padding:12px;border-radius:10px;font:inherit;margin:4px 0 8px;border:1px solid #d3e0db}
button{background:#0d7c66;color:#fff;border:0;font-weight:700;cursor:pointer}#err{color:#b42318}table{width:100%;font-size:14px;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid #d3e0db}</style></head><body>
<h1>FreeNet Sponsors</h1><p id="err" role="alert"></p>
<div class="c" id="auth"><h2 id="ttl">Create your sponsor account</h2>
<input id="nm" placeholder="Brand or company name"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (8+ characters)">
<button id="main" onclick="go()">Sign up</button><button id="sw" style="background:none;color:#0d7c66" onclick="swap()">Already have an account? Sign in</button></div>
<div id="dash" hidden><div class="c"><h2>New campaign</h2><input id="b" placeholder="Brand name"><input id="m" placeholder="Ad message"><input id="v" placeholder="Video link (https://…, optional)"><input id="cpv" type="number" min="20" value="50" aria-label="Cost per view in naira"><button onclick="add()">Create campaign</button></div>
<div class="c"><h2>Your campaigns</h2><table id="tb"></table></div></div>
<script>
let T=sessionStorage.getItem('s')||'';const $=i=>document.getElementById(i),err=m=>$('err').textContent=m||'';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){let r,j;try{r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined})}catch{throw new Error('Cannot reach the server. Open this page from your running backend, for example http://SERVER_IP:3000/')}
  try{j=JSON.parse(await r.text())}catch{throw new Error('The server did not send data. Open this page from your running backend (not GitHub or a saved file) and make sure the API is running.')}
  if(!r.ok)throw new Error(j.error||'Something went wrong');return j}

let mode='register';
function swap(){mode=mode==='register'?'login':'register';const r=mode==='register';$('nm').hidden=!r;$('ttl').textContent=r?'Create your sponsor account':'Sign in to your sponsor account';$('main').textContent=r?'Sign up':'Sign in';$('sw').textContent=r?'Already have an account? Sign in':'New sponsor? Sign up'}
async function go(){try{err();const j=await api('sponsor/'+mode,{name:$('nm').value,email:$('em').value,password:$('pw').value});T=j.token;sessionStorage.setItem('s',T);load()}catch(e){err(e.message)}}
async function add(){try{err();await api('sponsor/campaigns',{brand:$('b').value,msg:$('m').value,video_url:$('v').value,cpv:+$('cpv').value});load()}catch(e){err(e.message)}}
async function topup(id){const a=+prompt('Amount in naira (min 500)','5000');if(!a)return;try{const j=await api('sponsor/topup',{campaign_id:id,amount:a});if(j.url)location.href=j.url;else err(j.error)}catch(e){err(e.message)}}
async function load(){if(!T)return;try{const r=await api('sponsor/campaigns');$('auth').hidden=true;$('dash').hidden=false;
  $('tb').innerHTML='<tr><th>Brand</th><th>Views</th><th>Budget</th><th></th></tr>'+r.map(c=>`<tr><td>${esc(c.brand)}</td><td>${c.views}</td><td>₦${c.budget}</td><td><button style="padding:4px;margin:0" onclick="topup(${c.id})">Add funds</button></td></tr>`).join('')}catch(e){T='';sessionStorage.removeItem('s')}}
load();</script></body></html>
