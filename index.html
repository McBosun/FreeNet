<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeNet WiFi</title><style>
body{font:16px/1.5 system-ui,sans-serif;max-width:440px;margin:0 auto;padding:20px;background:#eef4f1;color:#10302f}
.c{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid #d3e0db}
input,button{width:100%;padding:12px;border-radius:10px;font:inherit;margin:4px 0 8px;border:1px solid #d3e0db}
button{background:#0d7c66;color:#fff;border:0;font-weight:700;cursor:pointer}button.hi{background:#f2a900;color:#10302f}
video{width:100%;border-radius:10px}#err{color:#b42318}.ph{display:flex;gap:8px}.ph select{width:118px;padding:12px;border-radius:10px;border:1px solid #d3e0db;margin:4px 0 8px;font:inherit}</style></head><body>
<h1>FreeNet WiFi</h1><p id="err" role="alert"></p>
<div class="c" id="login"><p>Create your account with your phone number to get online. Signing in again later uses the same number.</p><div class="ph"><select id="cc" aria-label="Country code"><option value="+234">🇳🇬 +234</option><option value="+233">🇬🇭 +233</option><option value="+254">🇰🇪 +254</option><option value="+27">🇿🇦 +27</option><option value="+229">🇧🇯 +229</option><option value="+228">🇹🇬 +228</option><option value="+225">🇨🇮 +225</option><option value="+237">🇨🇲 +237</option><option value="+256">🇺🇬 +256</option><option value="+255">🇹🇿 +255</option><option value="+20">🇪🇬 +20</option><option value="+44">🇬🇧 +44</option><option value="+1">🇺🇸 +1</option><option value="+971">🇦🇪 +971</option><option value="+91">🇮🇳 +91</option></select><input id="ph" type="tel" placeholder="803 000 0000" autocomplete="tel-national"></div><button onclick="signIn()">Sign up / Sign in</button></div>
<div class="c" id="home" hidden><button class="hi" onclick="startAd()">Watch ad, get 30 free minutes</button>
<input id="vc" placeholder="Voucher code"><button onclick="redeem()">Redeem voucher</button></div>
<div class="c" id="ad" hidden><b id="brand"></b><p id="msg"></p><video id="vid" playsinline muted autoplay hidden></video><button id="claim" disabled></button></div>
<form id="go" method="post" hidden><input name="username"><input name="password"><input name="dst"></form>
<script>
const Q=new URLSearchParams(location.search);let T=sessionStorage.getItem('t')||'';
const $=i=>document.getElementById(i),err=m=>$('err').textContent=m||'';
async function api(p,b){let r,j;try{r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined})}catch{throw new Error('Cannot reach the server. Open this page from your running backend, for example http://SERVER_IP:3000/')}
  try{j=JSON.parse(await r.text())}catch{throw new Error('The server did not send data. Open this page from your running backend (not GitHub or a saved file) and make sure the API is running.')}
  if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
const full=(c,n)=>$(c).value+$(n).value.replace(/\D/g,'').replace(/^0+/,'');
function show(){$('login').hidden=!!T;$('home').hidden=!T}
async function signIn(){try{err();const j=await api('login',{phone:full('cc','ph')});T=j.token;sessionStorage.setItem('t',T);show()}catch(e){err(e.message)}}
function connect(g){const f=$('go');f.action=Q.get('login')||'http://192.168.88.1/login';
  f.username.value=g.username;f.password.value=g.password;f.dst.value=Q.get('dst')||'https://www.google.com';f.submit()}
async function startAd(){try{err();const a=await api('ad/start');$('home').hidden=true;$('ad').hidden=false;
  $('brand').textContent=a.brand;$('msg').textContent=a.msg;if(a.video_url){$('vid').src=a.video_url;$('vid').hidden=false}
  let n=a.seconds;const b=$('claim');b.disabled=true;b.textContent='Claim in '+n+'s';
  const t=setInterval(()=>{n--;if(n>0)b.textContent='Claim in '+n+'s';else{clearInterval(t);b.disabled=false;b.textContent='Claim 30 free minutes';
    b.onclick=async()=>{try{connect(await api('ad/claim',{token:a.token}))}catch(e){err(e.message)}}}},1000)}catch(e){err(e.message)}}
async function redeem(){try{err();connect(await api('voucher/redeem',{code:$('vc').value}))}catch(e){err(e.message)}}
show();</script></body></html>
